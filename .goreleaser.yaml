# goreleaser config for a precompiled gh CLI extension.
#
# gh's extension installer downloads the single release asset whose name ENDS
# WITH "<os>-<arch>" (strings.HasSuffix) and executes it directly — it does not
# unpack archives. So we publish RAW BINARIES (formats: [binary]), not tarballs,
# named "<name>_<version>_<os>-<arch>".
version: 2

project_name: gh-ctx

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: gh-ctx
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # Publish the bare binary; the asset name must end in <os>-<arch> for gh.
  - id: bin
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
